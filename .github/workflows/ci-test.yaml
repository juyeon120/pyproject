name: ci-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-test-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest
  build:
    needs: [run-test-code]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Image build
        run: docker build -t juyeon13241/flaskweb:latest .
      - name: Image Display
        run: docker images
      - name: Docker Hub Login
        uses: docker/login-action@v1
        with:
          username: juyeon13241
          password: ${{ secrets.DOCKERHUB_TOKEN}}
      - name: Image Push
        run: docker push juyeon13241/flaskweb:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: juyeon13241
          DOCKER_REPO: flaskweb
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
        with:
          host: 13.125.241.82
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME, DOCKER_REPO, DOCKER_TOKEN
          debug: true
          time: 30s